name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vst3:
    name: Windows VST3
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    env:
      BUNDLE: build/Rygostancija_artefacts/Release/VST3/Rygostancija.vst3

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # third_party/JUCE is not in the repository, so CMake fetches JUCE by itself.
      # No -G: CMake picks the newest Visual Studio on the runner.
      - name: Configure
        run: cmake -S . -B build -A x64 -DRYGO_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --target Rygostancija_VST3 --parallel

      - name: Check the bundle
        run: |
          $binary = (Resolve-Path "$env:BUNDLE/Contents/x86_64-win/Rygostancija.vst3").Path

          foreach ($file in "moduleinfo.json", "Art/background.jpg") {
              if (-not (Test-Path "$env:BUNDLE/Contents/Resources/$file")) { throw "Missing from the bundle: $file" }
          }

          $expected = (Get-ChildItem factory_samples -Recurse -File).Count
          $actual = (Get-ChildItem "$env:BUNDLE/Contents/Resources/Samples" -Recurse -File).Count
          if ($actual -ne $expected) { throw "Expected $expected samples in the bundle, found $actual" }
          Write-Host "$actual samples in the bundle"

          # The plugin has to load on a PC without the Visual C++ Redistributable.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = (Resolve-Path "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1).Path
          $dependencies = & $dumpbin /dependents $binary | Out-String
          Write-Host $dependencies
          if ($dependencies -notmatch 'KERNEL32\.dll') { throw "dumpbin could not read the plugin" }
          if ($dependencies -match 'VCRUNTIME|MSVCP') { throw "The plugin still needs the Visual C++ Redistributable" }

      - name: Package
        id: package
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(Rygostancija VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $name = "Rygostancija-$version-windows"
          $stage = "dist/$name"

          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse $env:BUNDLE $stage
          Copy-Item scripts/install_windows.bat "$stage/install.bat"
          Copy-Item scripts/readme_windows.txt "$stage/README.txt"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

          "name=$name" >> $env:GITHUB_OUTPUT

      # The runner already has administrator rights, and NUL answers the final pause.
      - name: Try the installer
        shell: cmd
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
        run: |
          call "dist\%PACKAGE%\install.bat" < NUL
          if errorlevel 1 exit /b 1
          set "INSTALLED=%CommonProgramW6432%\VST3\Rygostancija.vst3\Contents"
          if not exist "%INSTALLED%\x86_64-win\Rygostancija.vst3" exit /b 1
          dir /s /b "%INSTALLED%\Resources\Samples\*.flac" >nul || exit /b 1
          if not exist "%INSTALLED%\Resources\Art\background.jpg" exit /b 1

      # archive: false keeps the zip as it is, without wrapping it in a second zip.
      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.package.outputs.name }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
